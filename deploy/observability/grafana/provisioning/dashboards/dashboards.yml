# Grafana 仪表盘提供器：从 /var/lib/grafana/dashboards 自动加载 JSON
apiVersion: 1

providers:
  - name: rule-engine
    orgId: 1
    folder: Rule Engine
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
