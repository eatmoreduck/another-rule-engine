# =============================================================================
# Logstash 管道：从挂载卷读取两个服务的 Logstash JSON 日志（阶段 4 产出）
#   服务侧：SPRING_PROFILES_ACTIVE=json → logs/decision-api.json、logs/admin-api.json
#           （compose 中共享卷 app-logs：服务写 /app/logs，此处读 /logs）
# 输出：stdout（最小可用）；接入 Elasticsearch 时解开底部 output 注释即可。
# =============================================================================
input {
  file {
    mode => "tail"
    path => "/logs/*.json"
    codec => json # 服务端已是 Logstash JSON 编码，直接解析为事件字段
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    # 本地观察用：文件发现间隔调小
    discover_interval => 5
  }
}

output {
  stdout {
    codec => rubydebug
  }
  # ── Elasticsearch 占位（接入时取消注释并填地址）──────────────
  # elasticsearch {
  #   hosts => ["http://elasticsearch:9200"]
  #   index => "rule-engine-logs-%{+YYYY.MM.dd}"
  # }
}
