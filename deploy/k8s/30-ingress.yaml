# =============================================================================
# Ingress：路径分流（生产网关层）
#   /api/*    -> admin-api（统一部署物：管理面 + 决策面同进程）
#   /         -> frontend  （SPA 静态站点）
#
# 2026-10 合并部署物后不再需要决策族特殊路由（原 /api/v1/decide* 与
# decision-flows/*/execute 正则分流已无意义，统一后端单后端承接）。
# 其他 Ingress Controller（Traefik/Envoy Gateway/APISIX）需按各自语法等价改写。
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rule-engine
  namespace: rule-engine
  labels:
    app.kubernetes.io/part-of: rule-engine
  annotations:
    # 决策链路 50ms SLA：网关层不缓冲请求/响应体
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # ---- 统一后端 -----------------------------------------------------
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: admin-api
                port:
                  number: 8080
          # ---- 前端 SPA -----------------------------------------------------
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
