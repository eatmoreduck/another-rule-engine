# =============================================================================
# HPA：decision-api 按 CPU 70% 扩缩（min 2 / max 10）
#
# 自定义指标（QPS / decision.duration）扩缩说明：
#   资源指标（CPU）由 metrics-server 提供，开箱即用；
#   按决策 QPS（rate(decision_duration_seconds_count)）扩缩需要自定义指标管道：
#   prometheus-adapter（把 PromQL 映射为 custom.metrics.k8s.io）或 KEDA（ScaledObject），
#   建议目标形如 2000 QPS/副本。管道就位后在此追加：
#     metrics:
#       - type: Pods
#         pods:
#           metric:
#             name: decision_qps_per_pod   # prometheus-adapter 规则产出
#           target:
#             type: AverageValue
#             averageValue: "2000"
#   当前阶段未部署 adapter/KEDA，仅启用 CPU 指标。
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: decision-api
  namespace: rule-engine
  labels:
    app.kubernetes.io/name: decision-api
    app.kubernetes.io/part-of: rule-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: decision-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # 决策流量可突发：快速扩容、温和缩容，避免决策链路抖动
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100 # 每 15s 可翻倍
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1 # 每 30s 最多缩 1 副本
          periodSeconds: 30
