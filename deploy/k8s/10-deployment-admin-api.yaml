# =============================================================================
# Deployment：admin-api（管理服务，8080，Sa-Token 认证）
# 管理面流量低，单副本即可（可按需调大；未接 Redis 会话前多副本登录态不共享）
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: rule-engine
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/part-of: rule-engine
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-api
        app.kubernetes.io/part-of: rule-engine
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: admin-api
          # ⚠️ 部署前替换为实际 registry 地址
          image: rule-engine/admin-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: admin-api-config
            - secretRef:
                name: rule-engine-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
