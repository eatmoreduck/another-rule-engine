# =============================================================================
# Secret 模板：数据库 / Redis 凭据
# ⚠️ 占位符文件：apply 前必须把 CHANGE_ME 替换为真实值（或改用
#    external-secrets / SealedSecrets / 云 KMS 注入），切勿把真实密码提交进仓库。
#   - REDIS_URL 为阶段 5 会话共享/缓存失效广播的连接串（无密码可去掉 :password@ 段；
#     Redis 不可用时服务优雅降级为内存会话，不影响启动）
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rule-engine-secrets
  namespace: rule-engine
  labels:
    app.kubernetes.io/part-of: rule-engine
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://CHANGE_ME_PG_HOST:5432/CHANGE_ME_DB?stringtype=unspecified"
  DB_USERNAME: "CHANGE_ME_DB_USER"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  # 阶段 5：Redis 会话共享 / 缓存失效广播（覆盖 spring.data.redis.url）
  # 无密码实例：redis://CHANGE_ME_REDIS_HOST:6379
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@CHANGE_ME_REDIS_HOST:6379"
