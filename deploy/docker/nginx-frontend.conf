# =============================================================================
# 前端站点 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. SPA history 路由回退（非文件请求一律回 index.html）
#   2. API 统一上游（与前端 dev 代理 vite.config.ts 的生产等价物）：
#      全部 /api/* -> admin-api:8080（统一部署物：管理面 + 决策面同进程）
#   3. gzip + 静态资源长缓存
#
# 2026-10 合并部署物后不再需要 decide 族/execute 正则的分流规则。
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- API 上游 --------------------------------------------------------

    # 全部 API 进统一后端（认证、规则/版本/灰度/特征/决策流 CRUD、审计、决策执行）
    location /api/ {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        # 决策链路 50ms SLA 在服务内闭环；网关读超时不做长等待兜底
        proxy_read_timeout 10s;
    }

    # ---- 静态资源 ---------------------------------------------------------

    # Vite 指纹产物：不可变缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
