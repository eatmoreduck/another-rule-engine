# =============================================================================
# 前端站点 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. SPA history 路由回退（非文件请求一律回 index.html）
#   2. API 路径分流（与前端 dev 代理 vite.config.ts 的生产等价物）：
#      - /api/v1/decide*                        -> decision-api:8081（直传/按 key 决策）
#      - /api/v1/decision-flows/{key}/execute   -> decision-api:8081（决策流执行）
#      - 其余 /api/*                            -> admin-api:8080（管理面 CRUD/认证等）
#   3. gzip + 静态资源长缓存
#
# location 优先级说明：
#   - ^~ 前缀命中后跳过正则，保证 decide 族稳定进决策服务
#   - execute 正则在普通前缀（location /api/）之前评估，命中即分流
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- API 分流 ---------------------------------------------------------

    # 决策服务：决策执行族（/api/v1/decide 与 /api/v1/decide/{ruleKey}）
    location ^~ /api/v1/decide {
        proxy_pass http://decision-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        # 50ms SLA 链路：读超时不做长等待兜底
        proxy_read_timeout 10s;
    }

    # 决策服务：决策流执行（仅 execute 动作；流图 CRUD 属管理面，走 admin-api）
    location ~ ^/api/v1/decision-flows/[^/]+/execute$ {
        proxy_pass http://decision-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 其余 API 一律进管理服务（认证、规则/版本/灰度/特征/决策流 CRUD、审计）
    location /api/ {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ---- 静态资源 ---------------------------------------------------------

    # Vite 指纹产物：不可变缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
