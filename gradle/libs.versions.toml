# 版本目录：所有第三方依赖的唯一事实源
# 版本号均于 2026-09 经官方仓库 metadata 核实（repo1.maven.org / plugins.gradle.org / services.gradle.org）

[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
springBoot = "4.1.1"
groovy = "5.1.3"
exposed = "1.5.0"
spotless = "8.9.0"
ktlint = "1.8.0"
caffeine = "3.3.0"
jackson = "3.2.3" # Jackson 3（tools.jackson 命名空间），与 Boot 4.1 BOM（jackson-bom 3.1.5）同大版本
h2 = "2.5.252"
postgresql = "42.7.13"
flyway = "13.8.1"
testcontainers = "2.0.5"
sa-token = "1.46.0"
logstash-encoder = "8.1"

[libraries]
# Kotlin 协程（决策链路并发取特征、异步日志）
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "coroutines" }

# Groovy 脚本引擎（规则 DSL 执行层，宿主为 Kotlin、脚本为 Groovy）
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
groovy-json = { module = "org.apache.groovy:groovy-json", version.ref = "groovy" }

# Exposed ORM（storage 模块，阶段 2 启用建模）
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
# Spring 事务集成（⚠️ 1.5.0 声明依赖 Spring 6.2.19，Gradle 仲裁到 Boot 4 的 Spring 7 后需运行时验证）
spring-transaction = { module = "org.jetbrains.exposed:spring-transaction", version.ref = "exposed" }
# ⚠️ 禁用：exposed-spring-boot-starter 1.5.0 绑定 Boot 3.5.8，会污染 Boot 4 classpath

# 测试数据库
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# 认证（Sa-Token，官方 Boot 4 starter）
sa-token-spring-boot4-starter = { module = "cn.dev33:sa-token-spring-boot4-starter", version.ref = "sa-token" }
# Sa-Token Redis 会话集成（跨服务 token 共享，阶段 5）
sa-token-redis-jackson = { module = "cn.dev33:sa-token-redis-jackson", version.ref = "sa-token" }

# 缓存与日志采集
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-encoder" }

# 数据库与迁移（阶段 2）
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
# ⚠️ 2.x 改名：旧名 org.testcontainers:postgresql / :junit-jupiter 在 2.0.5 下已无 artifact
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

# 本地缓存（脚本编译缓存）
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Jackson 3（注意：tools.jackson 命名空间，非 2.x 的 com.fasterxml）
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Spring Boot（版本由 BOM 统一管理，此处不声明版本）
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# 以下仅供 build-logic 约定插件在编译期使用，业务模块不要直接依赖
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
springBoot-gradlePlugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
groovy = ["groovy", "groovy-json"]
exposed = ["exposed-core", "exposed-jdbc", "exposed-java-time"]
jackson = ["jackson-databind", "jackson-module-kotlin"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
